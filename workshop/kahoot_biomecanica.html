<title>Quiz Biomec&aacute;nica Pilates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: single-screen quiz app, centered card with 2x2 answer grid */
  :root {
    --bg: #faf9f7;
    --fg: #1e1b18;
    --surface: #f0ede8;
    --muted: #8a8078;
    --accent: #00897b;
    --accent-light: #e0f2f1;
    --red: #e53935;
    --orange: #fb8c00;
    --blue: #1e88e5;
    --green: #43a047;
    --correct-bg: #c8e6c9;
    --wrong-bg: #ffcdd2;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171412;
      --fg: #e8e4df;
      --surface: #252119;
      --muted: #8a8078;
      --accent: #4db6ac;
      --accent-light: #1a302e;
      --red: #ef5350;
      --orange: #ffa726;
      --blue: #42a5f5;
      --green: #66bb6a;
      --correct-bg: #1b3a1e;
      --wrong-bg: #3d1618;
      --shadow: 0 2px 12px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171412;
    --fg: #e8e4df;
    --surface: #252119;
    --muted: #8a8078;
    --accent: #4db6ac;
    --accent-light: #1a302e;
    --red: #ef5350;
    --orange: #ffa726;
    --blue: #42a5f5;
    --green: #66bb6a;
    --correct-bg: #1b3a1e;
    --wrong-bg: #3d1618;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Outfit', sans-serif;
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100%;
  }

  .app {
    width: 100%;
    max-width: 640px;
    padding: 20px 0;
    min-height: 0;
  }

  /* Header */
  .quiz-header {
    text-align: center;
    margin-bottom: 16px;
  }
  .quiz-header .brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .quiz-header h1 {
    font-size: 22px;
    font-weight: 900;
    margin: 4px 0 0;
    text-wrap: balance;
  }

  /* Progress */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .4s ease;
  }
  .progress-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    min-width: 44px;
    text-align: right;
  }

  /* Score bar */
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
  }
  .score-bar .correct-count { color: var(--green); }
  .score-bar .wrong-count { color: var(--red); }

  /* Question card */
  .question-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .question-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .question-text {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.35;
    text-wrap: balance;
  }
  .question-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-style: italic;
  }

  /* Answer grid */
  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  @media (max-width: 420px) {
    .answers { grid-template-columns: 1fr; }
  }

  .answer-btn {
    position: relative;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 14px 14px 14px 40px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: transform .12s, border-color .2s, background .2s;
    min-width: 0;
  }
  .answer-btn:hover:not(:disabled) {
    transform: translateY(-1px);
  }
  .answer-btn:active:not(:disabled) {
    transform: translateY(0);
  }
  .answer-btn .letter {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
  }
  .answer-btn:nth-child(1) { background: rgba(229,57,53,.08); }
  .answer-btn:nth-child(1) .letter { background: var(--red); }
  .answer-btn:nth-child(2) { background: rgba(30,136,229,.08); }
  .answer-btn:nth-child(2) .letter { background: var(--blue); }
  .answer-btn:nth-child(3) { background: rgba(251,140,0,.08); }
  .answer-btn:nth-child(3) .letter { background: var(--orange); }
  .answer-btn:nth-child(4) { background: rgba(67,160,71,.08); }
  .answer-btn:nth-child(4) .letter { background: var(--green); }

  .answer-btn.selected-correct {
    background: var(--correct-bg) !important;
    border-color: var(--green);
  }
  .answer-btn.selected-wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--red);
  }
  .answer-btn.reveal-correct {
    border-color: var(--green);
    border-style: dashed;
  }
  .answer-btn:disabled { cursor: default; opacity: .7; }
  .answer-btn.selected-correct:disabled,
  .answer-btn.selected-wrong:disabled,
  .answer-btn.reveal-correct:disabled { opacity: 1; }

  /* Feedback */
  .feedback {
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .feedback.correct-fb { background: var(--correct-bg); color: var(--green); }
  .feedback.wrong-fb { background: var(--wrong-bg); color: var(--red); }
  .feedback .explanation {
    font-weight: 400;
    color: var(--fg);
    margin-top: 4px;
    font-size: 12px;
  }

  /* Next button */
  .next-btn {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
  }
  .next-btn:hover { opacity: .9; }

  /* Results screen */
  .results {
    text-align: center;
    padding: 30px 0;
  }
  .results .big-score {
    font-family: 'Space Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .results .big-label {
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }
  .results .verdict {
    font-size: 20px;
    font-weight: 800;
    margin: 16px 0 6px;
  }
  .results .verdict-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 400px;
    margin: 0 auto 20px;
  }
  .results-breakdown {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
  }
  .results-breakdown .stat {
    text-align: center;
  }
  .results-breakdown .stat-num {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
  }
  .results-breakdown .stat-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .restart-btn {
    display: inline-block;
    padding: 12px 32px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    background: transparent;
    color: var(--accent);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .restart-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  .footer-brand {
    text-align: center;
    margin-top: 20px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>

<div class="app" id="app">
  <div class="quiz-header">
    <div class="brand">AntoBioMove</div>
    <h1>Quiz: Biomec&aacute;nica y Anatom&iacute;a en el Pilates</h1>
  </div>

  <div id="quiz-area"></div>

  <div class="footer-brand">Workshop Internacional &bull; Valencia 2026</div>
</div>

<script>
const questions = [
  {
    q: "&iquest;Cu&aacute;ntas articulaciones tiene aproximadamente el cuerpo humano?",
    options: ["206", "360", "180", "420"],
    correct: 1,
    explanation: "El cuerpo humano posee aproximadamente 360 articulaciones, distribuidas entre cadera, columna, manos, pies y otras regiones."
  },
  {
    q: "&iquest;Cu&aacute;les son los tres tipos de articulaciones seg&uacute;n su estructura?",
    options: [
      "M&oacute;viles, fijas y semifijas",
      "Fibrosas, cartilaginosas y sinoviales",
      "Esf&eacute;ricas, planas y en bisagra",
      "Primarias, secundarias y terciarias"
    ],
    correct: 1,
    explanation: "Se clasifican en fibrosas (inm&oacute;viles), cartilaginosas (parcialmente m&oacute;viles) y sinoviales (m&oacute;viles), cada una con funciones distintas en el movimiento."
  },
  {
    q: "&iquest;Qu&eacute; tipo de contracci&oacute;n muscular ocurre cuando el m&uacute;sculo se acorta?",
    options: ["Isom&eacute;trica", "Exc&eacute;ntrica", "Conc&eacute;ntrica", "Est&aacute;tica"],
    correct: 2,
    explanation: "La contracci&oacute;n conc&eacute;ntrica es aquella en la que el m&uacute;sculo se acorta al generar fuerza. La exc&eacute;ntrica ocurre cuando se alarga y la isom&eacute;trica cuando mantiene su longitud."
  },
  {
    q: "&iquest;Qu&eacute; es el Power House en Pilates?",
    options: [
      "El conjunto de m&uacute;sculos de las piernas",
      "El centro de fuerza y estabilidad del cuerpo",
      "La t&eacute;cnica de respiraci&oacute;n del m&eacute;todo",
      "El equipo principal del studio"
    ],
    correct: 1,
    explanation: "El Power House comprende los m&uacute;sculos del centro del cuerpo: transverso del abdomen, oblicuos, mult&iacute;fidos, suelo p&eacute;lvico y diafragma. Es el pilar de la estabilidad en Pilates."
  },
  {
    q: "&iquest;Cu&aacute;l es el primer ejercicio de la Serie Cl&aacute;sica de Pilates Mat?",
    options: ["The Roll Up", "The Saw", "The Hundred", "Rolling Like a Ball"],
    correct: 2,
    explanation: "The Hundred (El Cien) es el primer ejercicio del bloque de calentamiento en la serie cl&aacute;sica de Pilates Mat, dise&ntilde;ado para activar la circulaci&oacute;n y el Power House."
  },
  {
    q: "&iquest;Qu&eacute; movimientos permiten las articulaciones sinoviales?",
    options: [
      "Solo flexi&oacute;n y extensi&oacute;n",
      "Flexi&oacute;n, extensi&oacute;n, circunducci&oacute;n, abducci&oacute;n, aducci&oacute;n y rotaci&oacute;n",
      "Ninguno, son articulaciones fijas",
      "Solo rotaci&oacute;n lateral"
    ],
    correct: 1,
    explanation: "Las articulaciones sinoviales son las m&aacute;s m&oacute;viles del cuerpo. Est&aacute;n envueltas en una c&aacute;psula con l&iacute;quido sinovial y permiten seis tipos de movimiento."
  },
  {
    q: "&iquest;Cu&aacute;les son los cuatro m&uacute;sculos del cu&aacute;driceps?",
    options: [
      "B&iacute;ceps, tr&iacute;ceps, deltoides y trapecio",
      "Gl&uacute;teo mayor, medio, menor y piriforme",
      "Recto femoral, vasto intermedio, vasto lateral y vasto medial",
      "Semitendinoso, semimembranoso, b&iacute;ceps femoral y popl&iacute;teo"
    ],
    correct: 2,
    explanation: "El cu&aacute;driceps femoral se compone de cuatro m&uacute;sculos en la parte anterior del muslo. La &uacute;ltima opci&oacute;n corresponde a los tendones de la corva (isquiotibiales)."
  },
  {
    q: "&iquest;Qu&eacute; funci&oacute;n principal cumplen los huesos en el cuerpo?",
    options: [
      "Solo producir gl&oacute;bulos rojos",
      "Almacenar grasa exclusivamente",
      "Dar sost&eacute;n, proteger &oacute;rganos y permitir el movimiento",
      "Regular la temperatura corporal"
    ],
    correct: 2,
    explanation: "Los huesos son tejido vivo que conforma el esqueleto, proporcionan sost&eacute;n al cuerpo, protegen &oacute;rganos vitales (cr&aacute;neo al cerebro, costillas al coraz&oacute;n) y son punto de inserci&oacute;n muscular para el movimiento."
  },
  {
    q: "En la articulaci&oacute;n de la cadera, &iquest;qu&eacute; estructura recibe la cabeza del f&eacute;mur?",
    options: ["La r&oacute;tula", "El acet&aacute;bulo", "El menisco", "La bursa"],
    correct: 1,
    explanation: "El acet&aacute;bulo (acetabulum) es la cavidad en el hueso coxal donde encaja la cabeza del f&eacute;mur, formando una articulaci&oacute;n esf&eacute;rica de gran movilidad."
  },
  {
    q: "&iquest;Qu&eacute; tipo de contracci&oacute;n ocurre al bajar lentamente el cuerpo en un Roll Down?",
    options: ["Conc&eacute;ntrica", "Isom&eacute;trica", "Exc&eacute;ntrica", "Balistica"],
    correct: 2,
    explanation: "Al descender controladamente, los m&uacute;sculos abdominales se alargan mientras mantienen tensi&oacute;n, lo cual define una contracci&oacute;n exc&eacute;ntrica. Este control es esencial en Pilates."
  },
  {
    q: "&iquest;Cu&aacute;l de estos NO es un beneficio del Pilates?",
    options: [
      "Mejora la alineaci&oacute;n postural",
      "Aumenta el volumen muscular r&aacute;pidamente",
      "Previene lesiones del sistema m&uacute;sculo-esquel&eacute;tico",
      "Integra cuerpo y mente"
    ],
    correct: 1,
    explanation: "El Pilates fortalece y tonifica sin aumentar el volumen muscular. Su enfoque es la calidad del movimiento, la estabilidad y la conexi&oacute;n cuerpo-mente."
  },
  {
    q: "&iquest;Qu&eacute; protege la columna vertebral?",
    options: [
      "Los pulmones",
      "El coraz&oacute;n",
      "La m&eacute;dula espinal",
      "El est&oacute;mago"
    ],
    correct: 2,
    explanation: "La columna vertebral protege la m&eacute;dula espinal, el canal de comunicaci&oacute;n entre el cerebro y el resto del cuerpo. Su biomec&aacute;nica es fundamental en Pilates."
  }
];

let current = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

const area = document.getElementById('quiz-area');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const shuffled = shuffle(questions);
const letters = ['A', 'B', 'C', 'D'];

function renderQuestion() {
  answered = false;
  const q = shuffled[current];
  const pct = Math.round((current / shuffled.length) * 100);

  area.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${current + 1}/${shuffled.length}</div>
    </div>
    <div class="score-bar">
      <span class="correct-count">&#10003; ${correctCount}</span>
      <span class="wrong-count">&#10007; ${wrongCount}</span>
    </div>
    <div class="question-card">
      <div class="question-num">PREGUNTA ${current + 1}</div>
      <div class="question-text">${q.q}</div>
    </div>
    <div class="answers" id="answers">
      ${q.options.map((opt, i) => `
        <button class="answer-btn" data-idx="${i}">
          <span class="letter">${letters[i]}</span>
          ${opt}
        </button>
      `).join('')}
    </div>
    <div id="feedback-area"></div>
  `;

  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.idx)));
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = shuffled[current];
  const isCorrect = idx === q.correct;

  if (isCorrect) correctCount++;
  else wrongCount++;

  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(btn => {
    btn.disabled = true;
    const bIdx = parseInt(btn.dataset.idx);
    if (bIdx === idx && isCorrect) btn.classList.add('selected-correct');
    else if (bIdx === idx && !isCorrect) btn.classList.add('selected-wrong');
    if (bIdx === q.correct && !isCorrect) btn.classList.add('reveal-correct');
  });

  const fbArea = document.getElementById('feedback-area');
  fbArea.innerHTML = `
    <div class="feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '&#10003; &iexcl;Correcto!' : '&#10007; Incorrecto'}
      <div class="explanation">${q.explanation}</div>
    </div>
    <button class="next-btn" id="next-btn">
      ${current < shuffled.length - 1 ? 'Siguiente pregunta' : 'Ver resultados'}
    </button>
  `;

  document.getElementById('next-btn').addEventListener('click', () => {
    current++;
    if (current < shuffled.length) renderQuestion();
    else renderResults();
  });

  // Update score bar
  document.querySelector('.correct-count').innerHTML = `&#10003; ${correctCount}`;
  document.querySelector('.wrong-count').innerHTML = `&#10007; ${wrongCount}`;
}

function renderResults() {
  const total = shuffled.length;
  const pct = Math.round((correctCount / total) * 100);
  let verdict, sub;

  if (pct >= 90) {
    verdict = '&iexcl;Excelente dominio!';
    sub = 'Tienes un conocimiento s&oacute;lido de biomec&aacute;nica y anatom&iacute;a aplicada al Pilates. Est&aacute;s lista para aplicar estos fundamentos con confianza.';
  } else if (pct >= 70) {
    verdict = '&iexcl;Muy buen nivel!';
    sub = 'Dominas la mayor&iacute;a de los conceptos. Repasa las preguntas que fallaste para consolidar tu conocimiento.';
  } else if (pct >= 50) {
    verdict = 'Buen comienzo';
    sub = 'Tienes una base que necesita refuerzo en algunas &aacute;reas. Revisa el material del workshop con atenci&oacute;n en los temas que fallaste.';
  } else {
    verdict = 'A seguir practicando';
    sub = 'Te recomendamos repasar el contenido del workshop completo. Cada concepto es importante para tu formaci&oacute;n como instructora de Pilates.';
  }

  area.innerHTML = `
    <div class="results">
      <div class="big-score">${pct}%</div>
      <div class="big-label">${correctCount} de ${total} correctas</div>
      <div class="verdict">${verdict}</div>
      <div class="verdict-sub">${sub}</div>
      <div class="results-breakdown">
        <div class="stat">
          <div class="stat-num" style="color:var(--green)">${correctCount}</div>
          <div class="stat-label">Correctas</div>
        </div>
        <div class="stat">
          <div class="stat-num" style="color:var(--red)">${wrongCount}</div>
          <div class="stat-label">Incorrectas</div>
        </div>
      </div>
      <button class="restart-btn" id="restart-btn">Intentar de nuevo</button>
    </div>
  `;

  document.getElementById('restart-btn').addEventListener('click', () => {
    current = 0;
    correctCount = 0;
    wrongCount = 0;
    shuffled.sort(() => Math.random() - 0.5);
    renderQuestion();
  });
}

renderQuestion();
</script>
