<style>
/* Layout: full-viewport slide deck with fixed nav, stacked content cards */
:root {

}
@media (prefers-color-scheme: dark) {

    --fg-muted: #B8A48E;
    --accent: #D44A4A;
    --accent-warm: #F0943E;
    --accent-light: #5C3A1E;
    --surface: #2A1E14;
    --surface-alt: #362818;
    --border: rgba(240,148,62,0.15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A120A;
  --bg-slide: #231810;
  --fg: #F0E6D8;
  --fg-muted: #B8A48E;
  --accent: #D44A4A;
  --accent-warm: #F0943E;
  --accent-light: #5C3A1E;
  --surface: #2A1E14;
  --surface-alt: #362818;
  --border: rgba(240,148,62,0.15);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  height: 100%;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}

.deck {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

/* Slides container */
.slides-viewport {
  flex: 1;
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  margin-top: 8px;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: clamp(24px, 4vw, 48px);
  opacity: 0;
  transform: translateX(60px);
  transition: opacity var(--slide-transition), transform var(--slide-transition);
  pointer-events: none;
  overflow-y: auto;
  background: var(--bg-slide);
}
.slide.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
  z-index: 2;
}
.slide.exit-left {
  opacity: 0;
  transform: translateX(-60px);
}

/* Slide header stripe */
.slide-header {
  background: var(--accent);
  color: #fff;
  padding: 16px 24px;
  border-radius: 4px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.slide-header::after {
  content: '';
  position: absolute;
  right: -20px;
  top: -20px;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: var(--accent-warm);
  opacity: 0.18;
}
.slide-header h2 {
  font-family: var(--display);
  font-size: clamp(20px, 3.5vw, 32px);
  font-weight: 900;
  letter-spacing: 0.02em;
  text-wrap: balance;
  position: relative;
  z-index: 1;
}

/* Content animations */
.slide.active .anim {
  animation: fadeSlideUp 0.5s ease both;
}
.slide.active .anim:nth-child(1) { animation-delay: 0.15s; }
.slide.active .anim:nth-child(2) { animation-delay: 0.28s; }
.slide.active .anim:nth-child(3) { animation-delay: 0.4s; }
.slide.active .anim:nth-child(4) { animation-delay: 0.5s; }
.slide.active .anim:nth-child(5) { animation-delay: 0.6s; }
.slide.active .anim:nth-child(6) { animation-delay: 0.68s; }
.slide.active .anim:nth-child(7) { animation-delay: 0.76s; }
.slide.active .anim:nth-child(8) { animation-delay: 0.84s; }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .slide { transition: opacity 0.2s; transform: none !important; }
  .slide.exit-left { transform: none !important; }
  .slide.active .anim { animation: none !important; opacity: 1; }
}

/* Typography */
.slide-body { flex: 1; min-width: 0; }
.slide-body h3 {
  font-family: var(--display);
  font-size: clamp(18px, 2.5vw, 24px);
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 700;
}
.slide-body p, .slide-body li {
  font-size: clamp(14px, 1.8vw, 18px);
  line-height: 1.65;
  color: var(--fg);
}
.slide-body ul { list-style: none; padding: 0; }
.slide-body li {
  padding: 4px 0 4px 22px;
  position: relative;
}
.slide-body li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-warm);
}

.highlight {
  color: var(--accent-warm);
  font-weight: 700;
}
.tag {
  display: inline-block;
  background: var(--accent-warm);
  color: #fff;
  padding: 3px 12px;
  border-radius: 3px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-right: 6px;
  margin-bottom: 4px;
}
.tag.dark { background: var(--accent); }

.quote {
  border-left: 3px solid var(--accent-warm);
  padding: 12px 20px;
  margin: 16px 0;
  font-style: italic;
  color: var(--fg-muted);
  background: var(--surface);
  border-radius: 0 4px 4px 0;
}
.quote cite {
  display: block;
  margin-top: 6px;
  font-style: normal;
  font-weight: 600;
  color: var(--accent-warm);
  font-size: 0.9em;
}

/* Two-column layout */
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media (max-width: 600px) {
  .cols { grid-template-columns: 1fr; gap: 16px; }
}

.col-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
}
.col-card h4 {
  font-family: var(--display);
  color: var(--accent);
  font-size: clamp(15px, 2vw, 19px);
  margin-bottom: 8px;
  font-weight: 700;
}

/* Three-column layout */
.cols-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 700px) {
  .cols-3 { grid-template-columns: 1fr; }
}
.col-3-card {
  background: var(--surface);
  border-top: 3px solid var(--accent-warm);
  padding: 14px;
  border-radius: 0 0 4px 4px;
}
.col-3-card h4 {
  font-family: var(--display);
  color: var(--accent);
  font-size: clamp(14px, 1.8vw, 17px);
  margin-bottom: 8px;
  font-weight: 700;

}
.col-3-card .sub {

  color: var(--fg-muted);
  font-size: 13px;
  margin-bottom: 8px;
}

/* Number badges */
.num-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.num-badge {
  min-width: 48px;
  height: 36px;

  align-items: center;
  justify-content: center;
  background: var(--accent-warm);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  border-radius: 4px;
  flex-shrink: 0;
}
.num-row span { font-size: clamp(13px, 1.6vw, 16px); }

/* Portada */
.portada {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
  height: 100%;

.portada::before {

  width: 300px; height: 300px;
  border-radius: 50%;
  background: var(--accent-warm);

.portada::after {

.portada * { position: relative; z-index: 1; }
.portada h1 {

  font-size: clamp(26px, 5vw, 52px);

.portada .credit {

.portada .contact {
  font-size: clamp(11px, 1.4vw, 14px);
  color: rgba(255,255,255,0.6);
  margin-top: 8px;
}

/* Section transition slide */
.section-break {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  height: 100%;
  background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);

.section-break p {

}

/* Closing slide */
.closing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  height: 100%;
  background: linear-gradient(135deg, var(--accent) 0%, #5A1010 100%);

.closing h2 {

.closing .big {

}
.closing .brand {
  color: var(--accent-warm);
  font-size: clamp(14px, 2vw, 20px);

  letter-spacing: 0.04em;
}
.closing .contact {
  font-size: clamp(11px, 1.4vw, 14px);
  color: rgba(255,255,255,0.55);
}

/* Navigation */
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px));
  gap: 8px;

}
.nav-btn {

.nav-btn:active { transform: scale(0.92); }
.nav-btn:focus-visible { outline: 2px solid var(--accent-warm); outline-offset: 2px; }
.nav-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

.nav-center {

.progress-bar {

.progress-fill {

.auto-btn {

/* Pilates-specific accent cards */

</style>

const TOTAL = slidesData.length;
const viewport = document.getElementById('viewport');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const autoBtn = document.getElementById('autoBtn');

let current = 0;
let autoTimer = null;

// Build slide elements
slidesData.forEach((html, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  div.innerHTML = html;
  div.dataset.index = i;
  viewport.appendChild(div);
});

const slides = viewport.querySelectorAll('.slide');

function goTo(n, direction) {
  if (n < 0 || n >= TOTAL || n === current) return;
  const prev = slides[current];
  const next = slides[n];
  prev.classList.remove('active');
  prev.classList.add(direction === 'back' ? '' : 'exit-left');
  if (direction === 'back') {
    prev.style.transform = 'translateX(60px)';
    prev.style.opacity = '0';
  }
  setTimeout(() => {
    prev.classList.remove('exit-left');
    prev.style.transform = '';
    prev.style.opacity = '';
  }, 700);

  if (direction === 'back') {
    next.style.transform = 'translateX(-60px)';
    requestAnimationFrame(() => {
      next.classList.add('active');
      next.style.transform = '';
    });
  } else {
    next.classList.add('active');
  }

  current = n;
  updateUI();
}

function updateUI() {
  counter.textContent = `${current + 1} / ${TOTAL}`;
  progress.style.width = `${((current + 1) / TOTAL) * 100}%`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === TOTAL - 1;
}

function nextSlide() { goTo(current + 1, 'forward'); }
function prevSlide() { goTo(current - 1, 'back'); }

prevBtn.addEventListener('click', () => { stopAuto(); prevSlide(); });
nextBtn.addEventListener('click', () => { stopAuto(); nextSlide(); });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stopAuto(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stopAuto(); prevSlide(); }
});

// Touch swipe
let touchStart = 0;
viewport.addEventListener('touchstart', e => { touchStart = e.changedTouches[0].clientX; }, { passive: true });
viewport.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStart;
  if (Math.abs(diff) > 50) {
    stopAuto();
    diff < 0 ? nextSlide() : prevSlide();
  }
}, { passive: true });

// Auto-play
function startAuto() {
  autoBtn.classList.add('playing');
  autoBtn.innerHTML = '&#9724; Pausa';
  autoTimer = setInterval(() => {
    if (current < TOTAL - 1) nextSlide();
    else stopAuto();
  }, 10000);
}
function stopAuto() {
  if (!autoTimer) return;
  clearInterval(autoTimer);
  autoTimer = null;
  autoBtn.classList.remove('playing');
  autoBtn.innerHTML = '&#9654; Auto';
}
autoBtn.addEventListener('click', () => {
  autoTimer ? stopAuto() : startAuto();
});

updateUI();
</script>
